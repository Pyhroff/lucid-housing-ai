name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests (deterministic core)
        run: pip install pytest && python -m pytest -q tests
      - name: Syntax-check Python sources
        run: python -m compileall -q .
      - name: Run deterministic smoke checks
        run: |
          python dev_smoke_m1.py
          python dev_smoke_m2.py
          python dev_smoke_m3.py
          python dev_smoke_m4.py
          python dev_smoke_m5.py
          python dev_smoke_m6.py
          python dev_smoke_m7.py
