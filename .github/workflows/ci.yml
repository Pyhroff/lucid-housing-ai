name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax-check Python sources
        run: python -m compileall -q .
      - name: Run deterministic smoke checks
        run: |
          python dev_smoke_m1.py
          python dev_smoke_m2.py
          python dev_smoke_m3.py
          python dev_smoke_m4.py
          python dev_smoke_m5.py
          python dev_smoke_m6.py
          python dev_smoke_m7.py
